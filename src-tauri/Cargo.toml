[package]
name = "banditur"
version = "1.0.1"
edition = "2021"
build = "build.rs"

[[bin]]
name = "banditur"
path = "src/main.rs"

[lib]
name = "banditur_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell  = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

# Image processing — opt into only the formats we support
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "tiff", "bmp", "webp",
] }
# Pure-Rust EXIF reader (crate name is "kamadak-exif"; used as `exif` in code)
kamadak-exif = "0.6"
rayon        = "1"
tokio        = { version = "1", features = ["sync", "macros", "process"] }
# Mozilla's libjpeg-turbo — 2-3× faster JPEG encode/decode than pure Rust.
# Requires cmake on the build machine (brew install cmake / winget install cmake).
mozjpeg      = { version = "0.10", default-features = false }
[profile.dev]
opt-level = 1          # faster image processing during dev/testing

[profile.release]
codegen-units = 1
lto           = true
opt-level     = 3      # speed, not size — this is a desktop app
panic         = "abort"
strip         = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
